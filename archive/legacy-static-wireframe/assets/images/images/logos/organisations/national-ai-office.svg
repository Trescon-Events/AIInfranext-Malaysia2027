<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="100%" height="100%">
  <!-- NAIO Neural Network Geometric Emblem -->
  <g transform="translate(10, 6) scale(0.95)" stroke="#02071C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Connecting neural edges -->
    <line x1="51.98" y1="19.10" x2="40.26" y2="15.90" stroke-width="2.2" />
    <line x1="28.73" y1="18.64" x2="16.26" y2="29.86" stroke-width="2.2" />
    <line x1="16.69" y1="38.37" x2="39.55" y2="55.13" stroke-width="2.2" />
    <line x1="47.24" y1="52.76" x2="56.25" y2="27.24" stroke-width="2.2" />
    <!-- Cross-mesh connection for AI topology depth -->
    <line x1="33.75" y1="20.87" x2="45.00" y2="52.37" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="18.00" y1="34.37" x2="51.75" y2="20.87" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Neural cluster nodes -->
    <circle cx="33.75" cy="14.12" r="6.5" fill="#02071C" stroke="none" />
    <circle cx="11.25" cy="34.37" r="6.5" fill="#02071C" stroke="none" />
    <circle cx="45.00" cy="59.12" r="6.5" fill="#02071C" stroke="none" />
    <circle cx="58.50" cy="20.87" r="6.5" fill="#02071C" stroke="none" />
    <circle cx="33.75" cy="14.12" r="3" fill="#FFFFFF" stroke="none" />
    <circle cx="11.25" cy="34.37" r="3" fill="#FFFFFF" stroke="none" />
    <circle cx="45.00" cy="59.12" r="3" fill="#FFFFFF" stroke="none" />
    <circle cx="58.50" cy="20.87" r="3" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Vertical separator hairline -->
  <line x1="90" y1="18" x2="90" y2="66" stroke="#CBD5E1" stroke-width="1" />

  <!-- Distinct NAIO Typography -->
  <g transform="translate(104, 0)">
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="#02071C">NATIONAL AI OFFICE</text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="#64748B">MALAYSIA</text>
  </g>
</svg>